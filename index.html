<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>वार्ड 11 मतदाता खोज</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#fff8e7;
color:#29211d;
}

.wrap{
max-width:760px;
margin:auto;
padding:15px;
}

/* SEARCH */
.searchbox{
background:white;
border:3px solid #29211d;
border-radius:25px;
padding:12px 16px;
display:flex;
align-items:center;
gap:10px;
box-shadow:5px 5px 0 #f1b900;
margin-bottom:22px;
}

.searchbox span{
font-size:35px;
}

.searchbox input{
border:0;
outline:0;
font-size:19px;
width:100%;
}

.clear{
border:0;
border-radius:50%;
width:42px;
height:42px;
font-size:25px;
background:#ffe5e5;
color:#a71925;
}

/* HEADER */
.hero{
background:linear-gradient(110deg,#ffd12e,#ffe98b);
border-radius:25px;
padding:18px;
display:flex;
align-items:center;
gap:18px;
border:3px solid white;
box-shadow:0 4px 12px #d9c38b;
}

.hero img{
width:135px;
height:135px;
object-fit:cover;
border-radius:50%;
border:6px solid white;
}

.party{
display:inline-block;
background:#3e4197;
color:white;
padding:7px 15px;
border-radius:9px;
font-weight:bold;
}

.hero h1{
margin:8px 0 3px;
color:#a51e2b;
font-size:29px;
}

.hero p{
margin:4px 0;
font-weight:bold;
font-size:18px;
}

/* BALLOT */
.ballotRow{
display:flex;
gap:12px;
margin:15px 0;
}

.ballot,.symbol{
flex:1;
background:white;
border:2px solid #e3ca7c;
border-radius:18px;
padding:15px;
text-align:center;
}

.ballot{
background:#3e4197;
color:white;
}

.ballot small,
.symbol small{
display:block;
font-weight:bold;
font-size:15px;
}

.ballot strong{
font-size:42px;
}

.symbol{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.symbol img{
width:55px;
height:55px;
object-fit:contain;
}

.symbol b{
font-size:20px;
color:#a51e2b;
}

/* MAIN */
.section{
background:white;
border:2px solid #e2cc87;
border-radius:24px;
padding:20px;
margin-top:18px;
box-shadow:0 4px 10px #e7d9ae;
}

.section h2{
margin-top:0;
}

.muted{
color:#746960;
}

/* RESULT */
.voter{
border:3px solid #29221d;
border-radius:20px;
padding:17px;
margin-top:18px;
background:#fff;
}

.topline{
display:flex;
justify-content:space-between;
font-weight:bold;
border-bottom:1px solid #aaa;
padding-bottom:8px;
}

.voter h3{
font-size:27px;
margin:12px 0 5px;
}

.detail{
font-size:18px;
line-height:1.7;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin:15px 0;
}

.stat{
padding:11px;
border-radius:17px;
text-align:center;
color:white;
font-weight:bold;
}

.stat:nth-child(1){background:#3e4197}
.stat:nth-child(2){background:#b43132}
.stat:nth-child(3){
background:#efb72d;
color:#211b16;
}

.stat small{
display:block;
}

.stat strong{
font-size:30px;
}

/* POLLING CENTER */
.poll{
background:#fff4ce;
border:2px solid #e7d39a;
border-radius:17px;
padding:17px;
margin-top:15px;
font-size:17px;
line-height:1.6;
}

.poll h4{
font-size:21px;
margin:0 0 5px;
}

/* HOUSE */
.houseList{
background:#fff;
border:2px solid #e7d39a;
border-radius:17px;
padding:15px;
margin-top:15px;
}

.houseList h4{
margin:0 0 10px;
}

.houseList div{
padding:8px 0;
border-bottom:1px dotted #cbb76e;
}

/* BUTTONS */
.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
}

.action{
border:2px solid #dfc477;
background:white;
border-radius:16px;
padding:12px 15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.action.primary{
background:#168d4c;
color:white;
border-color:#106d39;
}

.action.danger{
background:#fff3f3;
}

/* INFO */
.disclaimer{
font-size:14px;
color:#756a61;
line-height:1.6;
margin-top:15px;
}

.empty{
text-align:center;
padding:25px;
color:#756a61;
font-size:17px;
}

/* MOBILE */
@media(max-width:600px){

.hero{
flex-direction:column;
text-align:center;
}

.hero img{
width:120px;
height:120px;
}

.hero h1{
font-size:25px;
}

.hero p{
font-size:16px;
}

.ballotRow{
gap:7px;
}

.symbol b{
font-size:17px;
}

.searchbox input{
font-size:17px;
}

.voter h3{
font-size:23px;
}

.detail{
font-size:16px;
}

.action{
width:100%;
}
}

/* PRINT / PDF */
@media print{

body{
background:white;
}

.searchbox,
.hero,
.ballotRow,
.section>h2,
.section>p,
.actions,
footer{
display:none!important;
}

.wrap{
padding:0;
max-width:700px;
}

.section{
border:0;
box-shadow:none;
padding:0;
}

.voter{
box-shadow:none;
page-break-inside:avoid;
}
}
</style>
</head>

<body>

<div class="wrap">

<!-- SEARCH -->
<div class="searchbox">
<span>⌕</span>

<input
id="search"
type="search"
placeholder="नाम, मकान नं. या क्रम संख्या..."
autocomplete="off">

<button class="clear" id="clear">×</button>
</div>


<!-- HEADER -->
<div class="hero">

<img src="IMG_4562.jpeg" alt="उम्मीदवार">

<div>
<div class="party">भारतीय जनता पार्टी</div>

<h1>वार्ड 11</h1>

<p>नीम का थाना नगर पालिका</p>

<p>नगर पालिका चुनाव 2026</p>
</div>

</div>


<!-- BALLOT -->
<div class="ballotRow">

<div class="ballot">
<small>बैलेट नं.</small>
<strong>2</strong>
</div>

<div class="symbol">

<img src="bjp-logo.png.JPG" alt="BJP">

<div>
<small>चुनाव चिन्ह</small>
<b>कमल का फूल</b>
</div>

</div>

</div>


<!-- SEARCH RESULT -->
<div class="section">

<h2>अपनी मतदाता पर्ची खोजें</h2>

<p class="muted">
नाम, पिता/पति का नाम, मकान नं. या क्रम संख्या से खोजें।
</p>

<div id="result">
<div class="empty">
ऊपर अपना नाम, मकान नंबर या क्रम संख्या लिखें।
</div>
</div>

</div>

</div>


<script>

let voters=[];

const search=document.getElementById("search");
const result=document.getElementById("result");
const clear=document.getElementById("clear");


function clean(value){
return String(value ?? "")
.toLowerCase()
.replace(/\s+/g," ")
.trim();
}


function getValue(obj,keys){

for(const key of keys){

if(
obj &&
obj[key] !== undefined &&
obj[key] !== null &&
String(obj[key]).trim() !== ""
){
return String(obj[key]).trim();
}

}

return "";
}


function maskEPIC(value){

if(!value){
return "उपलब्ध नहीं";
}

value=value.trim();

if(value.length<=5){
return "••••";
}

return value.slice(0,3)+"••••"+value.slice(-3);
}


/* VOTER CARD */

function voterCard(v,index){

const name=getValue(v,["name","नाम"]) || "नाम उपलब्ध नहीं";

const relative=getValue(v,[
"relative",
"father",
"husband",
"पिता/पति का नाम"
]);

const age=getValue(v,["age","उम्र"]);

const gender=getValue(v,["gender","लिंग"]);

const house=getValue(v,[
"house",
"house_no",
"मकान नं."
]);

const serial=getValue(v,[
"serial",
"क्रम संख्या"
]);

const epic=getValue(v,[
"epic",
"EPIC",
"Voter ID"
]);

const part=getValue(v,[
"part",
"भाग संख्या"
]) || "1";

const booth=getValue(v,[
"booth",
"बूथ"
]) || "1";


return `

<div class="voter">

<div class="topline">

<span>मतदाता सूचना पर्ची</span>

<span>
वार्ड 11 · नीम का थाना नगर पालिका
</span>

</div>


<div style="
display:flex;
justify-content:space-between;
gap:10px;
">

<h3>${name}</h3>

<h3>क्रम ${serial || "-"}</h3>

</div>


<div class="detail">

${relative ?
`<div>
पिता/पति का नाम:
<b>${relative}</b>
</div>`
:""}


<div>

${age ? age+" वर्ष" : ""}

${gender ? " · "+gender : ""}

${house ? " · मकान "+house : ""}

</div>


<div>

वोटर आईडी:
<b>${maskEPIC(epic)}</b>

</div>

</div>


<!-- THREE BOXES -->

<div class="stats">

<div class="stat">

<small>भाग संख्या</small>

<strong>${part}</strong>

</div>


<div class="stat">

<small>क्रम संख्या</small>

<strong>${serial || "-"}</strong>

</div>


<div class="stat">

<small>बूथ नं.</small>

<strong>${booth}</strong>

</div>

</div>


<!-- POLLING CENTER -->

<div class="poll">

<h4>📍 आपका मतदान केंद्र</h4>

<b>
Government School, नीम का थाना
</b>

<div>
भाग संख्या 1 · बूथ नं. 1
</div>

<div style="margin-top:8px">

मतदान केंद्र की जानकारी आधिकारिक चुनाव रिकॉर्ड से भी सत्यापित करें।

</div>

</div>


<!-- BUTTONS -->

<div class="actions">

<button
class="action primary"
onclick="shareSlip(${index})">

📱 पर्ची की फोटो WhatsApp करें

</button>


<button
class="action"
onclick="makePDF(${index})">

📄 PDF बनाएं

</button>


<button
class="action"
onclick="printSlip(${index})">

🖨️ प्रिंट

</button>


<button
class="action"
onclick="sendText(${index})">

✉️ केवल टेक्स्ट भेजें

</button>


<button
class="action danger"
onclick="this.closest('.voter').remove()">

बंद करें

</button>

</div>


<div class="disclaimer">

यह निजी, अनौपचारिक मतदाता सहायता सुविधा है।
आधिकारिक निर्वाचन रिकॉर्ड ही अंतिम मान्य स्रोत है।

</div>

</div>

`;

}


/* SEARCH */

function doSearch(){

const q=clean(search.value);

if(!q){

result.innerHTML=`

<div class="empty">

ऊपर अपना नाम, मकान नंबर या क्रम संख्या लिखें।

</div>`;

return;

}


const found=voters.filter(v=>{

const fields=[

getValue(v,["name","नाम"]),

getValue(v,[
"relative",
"father",
"husband",
"पिता/पति का नाम"
]),

getValue(v,[
"house",
"house_no",
"मकान नं."
]),

getValue(v,[
"serial",
"क्रम संख्या"
])

];

return fields.some(x=>clean(x).includes(q));

});


if(!found.length){

result.innerHTML=`

<div class="empty">

कोई मतदाता नहीं मिला।

</div>`;

return;

}


let html=`

<div class="resultsTitle">

मतदाता सूचना पर्ची

</div>

`;


found.forEach(v=>{

const index=voters.indexOf(v);

html+=voterCard(v,index);

});


html+=`

<div class="actions">

<button
class="action"
onclick="secondSearch()">

दूसरा नाम खोजें

</button>

</div>

`;


result.innerHTML=html;

}


function secondSearch(){

search.value="";

search.focus();

result.innerHTML=`

<div class="empty">

दूसरा नाम, मकान नंबर या क्रम संख्या खोजें।

</div>`;

}


/* TEXT */

function slipText(v){

return `मतदाता सूचना पर्ची

वार्ड 11 · नीम का थाना नगर पालिका

नाम: ${getValue(v,["name","नाम"])}

पिता/पति: ${getValue(v,[
"relative",
"father",
"husband",
"पिता/पति का नाम"
])}

उम्र: ${getValue(v,["age","उम्र"])}

लिंग: ${getValue(v,["gender","लिंग"])}

मकान नं.: ${getValue(v,[
"house",
"house_no",
"मकान नं."
])}

क्रम संख्या: ${getValue(v,[
"serial",
"क्रम संख्या"
])}

भाग संख्या: 1

बूथ नं.: 1

मतदान केंद्र:
Government School, नीम का थाना`;

}


/* TEXT SHARE */

function sendText(index){

const text=slipText(voters[index]);

if(navigator.share){

navigator.share({
text:text
});

}else{

navigator.clipboard?.writeText(text);

alert("टेक्स्ट कॉपी हो गया।");

}

}


/* WHATSAPP / SHARE */

function shareSlip(index){

const text=slipText(voters[index]);

if(navigator.share){

navigator.share({
text:text
});

}else{

window.open(
"https://wa.me/?text="+encodeURIComponent(text),
"_blank"
);

}

}


/* PRINT */

function printSlip(index){

const cards=document.querySelectorAll(".voter");

cards.forEach((card,i)=>{

card.style.display =
i===index ? "block" : "none";

});

window.print();

cards.forEach(card=>{

card.style.display="";

});

}


/* PDF */

function makePDF(index){

printSlip(index);

}


/* LOAD VOTERS */

fetch("voters.json")

.then(response=>response.json())

.then(data=>{

voters=
Array.isArray(data)
? data
: (data.voters || data.data || []);

})

.catch(error=>{

result.innerHTML=`

<div class="empty">

voters.json लोड नहीं हो सकी।

</div>`;

});


search.addEventListener(
"input",
doSearch
);


clear.addEventListener(
"click",
secondSearch
);

</script>

</body>
</html>
