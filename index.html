<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>वार्ड 11 मतदाता सूचना पर्ची</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#fff8df;
  color:#222;
}

.container{
  max-width:850px;
  margin:auto;
  padding:14px;
}

/* SEARCH */
.searchBox{
  background:#fff;
  border:4px solid #33281f;
  border-radius:28px;
  min-height:70px;
  display:flex;
  align-items:center;
  padding:8px 18px;
  box-shadow:6px 7px 0 #f5b400;
  margin-bottom:18px;
}

.searchIcon{
  font-size:34px;
  margin-right:14px;
}

.searchBox input{
  flex:1;
  border:0;
  outline:0;
  font-size:24px;
  font-weight:bold;
  background:transparent;
}

.clearBtn{
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:#fdeaea;
  color:#b40000;
  font-size:28px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#ffd52e,#fff08b);
  border:4px solid white;
  border-radius:30px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:20px;
  box-shadow:0 2px 10px #d8bd54;
  margin-bottom:15px;
}

.candidatePhoto{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  border:6px solid white;
  box-shadow:0 3px 8px #777;
}

.party{
  display:inline-block;
  background:#283da8;
  color:white;
  font-size:23px;
  font-weight:bold;
  padding:10px 18px;
  border-radius:14px;
  margin-bottom:8px;
}

.hero h1{
  margin:0;
  font-size:42px;
  color:#a60000;
}

.hero p{
  margin:5px 0;
  font-size:21px;
  font-weight:bold;
}

/* BALLOT */
.ballotRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.ballot,
.symbol{
  min-height:145px;
  border:3px solid #e0bd45;
  border-radius:25px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px;
}

.ballot{
  background:#303fa4;
  color:white;
  flex-direction:column;
}

.ballot small{
  font-size:23px;
}

.ballot strong{
  font-size:70px;
  line-height:1;
}

.symbol{
  gap:15px;
}

.symbol img{
  width:100px;
  height:100px;
  object-fit:contain;
}

.symbol small{
  display:block;
  font-size:21px;
  font-weight:bold;
}

.symbol b{
  display:block;
  font-size:25px;
  color:#a40000;
  margin-top:7px;
}

/* INFO */
.info{
  text-align:center;
  font-size:18px;
  color:#555;
  margin:10px 0 15px;
}

/* RESULT */
.result{
  background:white;
  border:3px solid #e0bd45;
  border-radius:25px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 2px 7px #ddd;
}

.resultTitle{
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin-bottom:14px;
}

.voterCard{
  border:3px solid #292929;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.cardHead{
  padding:13px 15px;
  border-bottom:1px solid #aaa;
  display:flex;
  justify-content:space-between;
  font-size:17px;
}

.voterName{
  font-size:31px;
  font-weight:bold;
  margin:8px 15px 3px;
}

.serial{
  font-size:20px;
  font-weight:bold;
  color:#222;
}

.details{
  padding:0 15px 12px;
  font-size:19px;
  line-height:1.55;
}

.boxRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:0 15px 15px;
}

.numberBox{
  border-radius:13px;
  padding:9px 5px;
  text-align:center;
  color:white;
  font-weight:bold;
  background:#30439f;
}

.numberBox:nth-child(2){
  background:#c63832;
}

.numberBox:nth-child(3){
  background:#f2c329;
  color:#111;
}

.numberBox small{
  display:block;
  font-size:15px;
}

.numberBox strong{
  font-size:29px;
}

/* POLLING CENTER */
.polling{
  margin:0 15px 15px;
  padding:13px;
  border:2px solid #e1b92d;
  border-radius:15px;
  background:#fff8db;
}

.pollingTitle{
  font-size:20px;
  font-weight:bold;
}

.pollingText{
  font-size:18px;
  margin-top:5px;
  line-height:1.5;
}

/* HOUSE */
.houseSection{
  padding:15px;
}

.houseTitle{
  font-size:21px;
  font-weight:bold;
  margin-bottom:10px;
}

.housePerson{
  background:#f5f5f5;
  border-radius:12px;
  padding:9px 12px;
  margin-bottom:7px;
  font-size:17px;
}

/* ACTION BUTTONS */
.actions{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1.2fr 1fr;
  gap:7px;
  padding:0 15px 15px;
}

.actions button{
  min-height:58px;
  border:2px solid #dfc56d;
  border-radius:14px;
  background:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.whatsapp{
  background:#168c4d !important;
  color:white;
  border-color:#11733e !important;
}

.close{
  color:#a40000;
}

/* CUT LINE */
.cutLine{
  border-top:3px dashed #777;
  margin:10px 15px 0;
  position:relative;
  text-align:center;
}

.cutLine span{
  background:white;
  padding:0 15px;
  position:relative;
  top:-14px;
  color:#555;
  font-size:16px;
}

/* CANDIDATE FOOTER */
.candidateFooter{
  padding:0 25px 18px;
  text-align:left;
}

.candidateFooter h2{
  font-size:30px;
  margin:3px 0;
}

.candidateFooter p{
  margin:4px 0;
  font-size:18px;
  line-height:1.5;
}

.disclaimer{
  text-align:center !important;
  color:#666;
  font-size:15px !important;
  margin-top:12px !important;
}

.publisher{
  text-align:center !important;
  color:#555;
  font-size:16px !important;
}

/* NO RESULT */
.noResult{
  text-align:center;
  background:white;
  border:2px solid #ddd;
  border-radius:18px;
  padding:25px;
  font-size:20px;
  color:#777;
}

/* MOBILE */
@media(max-width:600px){

  .container{
    padding:8px;
  }

  .hero{
    gap:12px;
    padding:10px;
  }

  .candidatePhoto{
    width:120px;
    height:120px;
  }

  .party{
    font-size:16px;
    padding:7px 10px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:16px;
  }

  .ballot,
  .symbol{
    min-height:120px;
  }

  .ballot strong{
    font-size:58px;
  }

  .symbol img{
    width:72px;
    height:72px;
  }

  .symbol small{
    font-size:16px;
  }

  .symbol b{
    font-size:18px;
  }

  .actions{
    grid-template-columns:1.5fr 1fr;
  }

  .actions button{
    font-size:15px;
  }

  .voterName{
    font-size:26px;
  }

  .details{
    font-size:17px;
  }
}

/* PRINT / PDF */
@media print{

  body{
    background:white;
  }

  .container{
    max-width:none;
    padding:0;
  }

  .searchBox,
  .hero,
  .ballotRow,
  .info,
  .actions{
    display:none !important;
  }

  .result{
    border:0;
    box-shadow:none;
    margin:0;
    padding:0;
  }

  .resultTitle{
    margin-top:0;
  }

  .voterCard{
    border:2px solid #222;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- SEARCH -->
  <div class="searchBox">

    <span class="searchIcon">⌕</span>

    <input
      id="search"
      type="text"
      placeholder="नाम, मकान नं. या क्रम संख्या..."
      autocomplete="off"
    >

    <button
      class="clearBtn"
      onclick="clearSearch()">
      ×
    </button>

  </div>


  <!-- CANDIDATE HEADER -->
  <div class="hero">

    <img
      src="DFA48B9F-A6ED-44DF-BA27-67BBCF543FDA(1).jpeg"
      class="candidatePhoto"
      alt="उम्मीदवार राहुल रांगेरा"
    >

    <div>

      <div class="party">
        भारतीय जनता पार्टी
      </div>

      <h1>वार्ड 11</h1>

      <p>नीम का थाना नगर पालिका</p>

      <p>नगर पालिका चुनाव 2026</p>

    </div>

  </div>


  <!-- BALLOT / SYMBOL -->
  <div class="ballotRow">

    <div class="ballot">

      <small>बैलेट नं.</small>

      <strong>2</strong>

    </div>


    <div class="symbol">

      <img
        src="bjp-logo.png.JPG"
        alt="BJP चुनाव चिन्ह"
      >

      <div>

        <small>चुनाव चिन्ह</small>

        <b>कमल का फूल</b>

      </div>

    </div>

  </div>


  <div class="info">
    मतदाता का नाम, पिता/पति का नाम,
    मकान नंबर या क्रम संख्या खोजें
  </div>


  <!-- RESULTS -->
  <div id="results"></div>

</div>


<script>

let voters = [];


/* LOAD VOTER DATA */

fetch("voters.json")

.then(response => response.json())

.then(data => {

  voters = Array.isArray(data) ? data : [];

  render(voters);

})

.catch(error => {

  document.getElementById("results").innerHTML =
  `
  <div class="noResult">
    voters.json लोड नहीं हो पाया।
  </div>
  `;

  console.error(error);

});


/* SEARCH */

document
.getElementById("search")
.addEventListener("input",function(){

  const q =
    this.value.trim().toLowerCase();


  if(!q){

    render(voters);

    return;
  }


  const filtered =
    voters.filter(v => {

      const text = [

        v.serial,
        v.slno,
        v.sr,
        v.name,
        v.relative,
        v.father,
        v.husband,
        v.house,
        v.houseNo,
        v.age,
        v.gender,
        v.epic,
        v.voterId,
        v.part,
        v.booth

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      return text.includes(q);

    });


  render(filtered);

});


/* RENDER */

function render(list){

  const results =
    document.getElementById("results");


  if(!list.length){

    results.innerHTML =
    `
    <div class="noResult">
      कोई मतदाता नहीं मिला।
    </div>
    `;

    return;
  }


  let html = `

    <div class="result">

      <div class="resultTitle">

        वार्ड 11, नीम का थाना नगर पालिका —
        मतदाता सूचना पर्चियां (${list.length})

      </div>

  `;


  list.forEach((v,index)=>{

    html += voterCard(v,index);

  });


  html += `</div>`;


  results.innerHTML = html;

}


/* VOTER CARD */

function voterCard(v,index){

  const serial =
    v.serial ||
    v.slno ||
    v.sr ||
    "-";


  const name =
    v.name ||
    "-";


  const relative =
    v.relative ||
    v.father ||
    v.husband ||
    "-";


  const house =
    v.house ||
    v.houseNo ||
    "-";


  const age =
    v.age ||
    "-";


  const gender =
    v.gender ||
    "-";


  const epic =
    v.epic ||
    v.voterId ||
    "-";


  const epicMasked =
    maskEpic(epic);


  return `

  <div
    class="voterCard"
    id="voter-${index}"
  >


    <div class="cardHead">

      <strong>
        मतदाता सूचना पर्ची
      </strong>

      <span>
        वार्ड 11 · नीम का थाना नगर पालिका
      </span>

    </div>


    <div class="voterName">

      ${escapeHtml(name)}

      <span class="serial">

        &nbsp;&nbsp;क्र. ${escapeHtml(serial)}

      </span>

    </div>


    <div class="details">

      <div>
        पिता/पति का नाम:
        <strong>
          ${escapeHtml(relative)}
        </strong>
      </div>


      <div>
        उम्र:
        ${escapeHtml(age)}
        वर्ष · लिंग:
        ${escapeHtml(gender)}
        · मकान नं.:
        ${escapeHtml(house)}
      </div>


      <div>
        मतदाता आईडी:
        ${escapeHtml(epicMasked)}
      </div>

    </div>


    <div class="boxRow">


      <div class="numberBox">

        <small>
          भाग संख्या
        </small>

        <strong>
          1
        </strong>

      </div>


      <div class="numberBox">

        <small>
          क्रम संख्या
        </small>

        <strong>
          ${escapeHtml(serial)}
        </strong>

      </div>


      <div class="numberBox">

        <small>
          बूथ नं.
        </small>

        <strong>
          1
        </strong>

      </div>


    </div>


    <!-- POLLING CENTER -->

    <div class="polling">

      <div class="pollingTitle">

        📍 आपका मतदान केंद्र

      </div>


      <div class="pollingText">

        <strong>
          Government School, Neem Ka Thana
        </strong>

        <br>

        भाग संख्या 1 · बूथ नं. 1

        <br>

        मतदान केंद्र की जानकारी
        आधिकारिक चुनाव रिकॉर्ड से भी सत्यापित करें।

      </div>

    </div>


    <!-- HOUSE MEMBERS -->

    <div class="houseSection">

      <div class="houseTitle">

        🏠 इसी मकान में दर्ज मतदाता

      </div>


      ${houseMembers(house)}

    </div>


    <!-- BUTTONS -->

    <div class="actions">


      <button
        class="whatsapp"
        onclick="shareWhatsApp(${index})">

        📱 पर्ची की फोटो
        WhatsApp करें

      </button>


      <button
        onclick="makePDF(${index})">

        📄 PDF बनाएं

      </button>


      <button
        onclick="printSlip(${index})">

        🖨️ प्रिंट

      </button>


      <button
        onclick="sendText(${index})">

        ✉️ केवल टेक्स्ट भेजें

      </button>


      <button
        class="close"
        onclick="closeCard(${index})">

        × बंद करें

      </button>


    </div>


    <!-- CUT LINE -->

    <div class="cutLine">

      <span>
        ✂️ यहाँ से काटें ✂️
      </span>

    </div>


    <!-- CANDIDATE DETAILS -->

    <div class="candidateFooter">


      <h2>
        राहुल रांगेरा
      </h2>


      <p>
        भाजपा प्रत्याशी · पार्षद पद · वार्ड 11
      </p>


      <p>

        <strong>
          बैलेट नं. 2 · चुनाव चिन्ह — कमल का फूल
        </strong>

      </p>


      <p>

        बैलेट नं. 2 के सामने
        चुनाव चिन्ह की जानकारी देखें।

      </p>


      <p class="disclaimer">

        यह निजी, अनौपचारिक सुविधा है —
        सरकारी दस्तावेज नहीं।
        मतदान के समय मूल फोटो पहचान-पत्र साथ रखें।

      </p>


      <p class="publisher">

        प्रकाशक:
        राहुल रांगेरा,
        भाजपा प्रत्याशी (पार्षद),
        वार्ड 11,
        नीम का थाना नगर पालिका

      </p>


    </div>


  </div>

  `;

}


/* HOUSE MEMBERS */

function houseMembers(house){

  if(
    !house ||
    house === "-"
  ){

    return `
      <div class="housePerson">
        मकान संख्या उपलब्ध नहीं है।
      </div>
    `;

  }


  const members =
    voters.filter(v => {

      const h =
        v.house ||
        v.houseNo ||
        "";

      return String(h)
        .trim()
        .toLowerCase()
        ===
        String(house)
        .trim()
        .toLowerCase();

    });


  if(!members.length){

    return `
      <div class="housePerson">
        इस मकान में अन्य मतदाता नहीं मिले।
      </div>
    `;

  }


  return members.map(v => {

    const n =
      v.name || "-";

    const s =
      v.serial ||
      v.slno ||
      "-";


    return `

      <div class="housePerson">

        <strong>
          ${escapeHtml(n)}
        </strong>

        — क्र.
        ${escapeHtml(s)}

      </div>

    `;

  }).join("");

}


/* MASK VOTER ID */

function maskEpic(epic){

  if(
    !epic ||
    epic === "-"
  ){

    return "-";

  }


  const str =
    String(epic);


  if(str.length <= 4){

    return "••••";

  }


  return (
    str.substring(0,3)
    +
    "••••"
    +
    str.substring(str.length-3)
  );

}


/* WHATSAPP */

function shareWhatsApp(index){

  const v =
    voters[index];


  if(!v) return;


  const message =

`मतदाता सूचना पर्ची

नाम: ${v.name || "-"}
क्रम संख्या: ${v.serial || "-"}
मकान नं.: ${v.house || "-"}

वार्ड 11
नीम का थाना नगर पालिका
भाग संख्या: 1
बूथ नं.: 1
बैलेट नं.: 2

प्रत्याशी: राहुल रांगेरा`;


  const url =
    "https://wa.me/?text="
    +
    encodeURIComponent(message);


  window.open(
    url,
    "_blank"
  );

}


/* TEXT SHARE */

function sendText(index){

  const v =
    voters[index];


  if(!v) return;


  const message =

`मतदाता सूचना पर्ची
नाम: ${v.name || "-"}
पिता/पति: ${v.relative || "-"}
मकान नं.: ${v.house || "-"}
क्रम संख्या: ${v.serial || "-"}
भाग संख्या: 1
बूथ नं.: 1
वार्ड: 11
नीम का थाना नगर पालिका
बैलेट नं.: 2
प्रत्याशी: राहुल रांगेरा`;


  if(navigator.share){

    navigator.share({

      title:
        "मतदाता सूचना पर्ची",

      text:
        message

    });

  }

  else if(navigator.clipboard){

    navigator.clipboard
      .writeText(message);

    alert(
      "टेक्स्ट कॉपी हो गया है।"
    );

  }

  else{

    alert(message);

  }

}


/* PRINT */

function printSlip(index){

  const cards =
    document.querySelectorAll(
      ".voterCard"
    );


  cards.forEach((card,i)=>{

    card.style.display =
      i === index
      ? "block"
      : "none";

  });


  window.print();


  setTimeout(()=>{

    cards.forEach(card=>{

      card.style.display =
        "block";

    });

  },1000);

}


/* PDF */

function makePDF(index){

  alert(
    "प्रिंट विंडो में 'Save as PDF' चुनें।"
  );


  printSlip(index);

}


/* CLOSE */

function closeCard(index){

  const card =
    document.getElementById(
      "voter-" + index
    );


  if(card){

    card.style.display =
      "none";

  }

}


/* CLEAR SEARCH */

function clearSearch(){

  document
    .getElementById("search")
    .value = "";


  render(voters);


  document
    .getElementById("search")
    .focus();

}


/* HTML SECURITY */

function escapeHtml(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
