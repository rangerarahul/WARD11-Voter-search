<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>वार्ड 11 मतदाता खोज</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#17365d;
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:700px;
  margin:25px auto;
  padding:0 15px;
}

.search-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:15px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  font-size:17px;
  border:0;
  border-radius:8px;
  background:#17365d;
  color:white;
}

#status{
  margin-top:15px;
  text-align:center;
  color:#666;
}

.result{
  background:white;
  margin-top:15px;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.result h3{
  margin-top:0;
  color:#17365d;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.row:last-child{
  border-bottom:0;
}

.label{
  font-weight:bold;
}

.no-result{
  background:white;
  margin-top:15px;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:25px 15px;
}
</style>
</head>

<body>

<div class="header">
  <h1>वार्ड 11 मतदाता खोज</h1>
  <p>मतदाता का नाम, पिता/पति का नाम या मकान नंबर खोजें</p>
</div>

<div class="container">

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="नाम / पिता या पति का नाम / मकान नं."
    >

    <button onclick="searchVoters()">मतदाता खोजें</button>

    <div id="status">डेटा लोड हो रहा है...</div>

  </div>

  <div id="results"></div>

</div>

<div class="footer">
  यह एक निजी एवं अनौपचारिक मतदाता खोज सुविधा है।
  आधिकारिक निर्वाचन रिकॉर्ड ही मान्य होगा।
</div>

<script>

let voters = [];

/* voters.json से data लोड करें */
fetch("voters.json")
  .then(response => {
    if(!response.ok){
      throw new Error("voters.json नहीं मिला");
    }
    return response.json();
  })
  .then(data => {
    voters = data;
    document.getElementById("status").innerText =
      "कुल " + voters.length + " मतदाता उपलब्ध हैं।";
  })
  .catch(error => {
    document.getElementById("status").innerText =
      "मतदाता डेटा लोड नहीं हो पाया।";
    console.error(error);
  });


function normalize(text){
  return String(text || "")
    .toLowerCase()
    .trim();
}


function searchVoters(){

  const query = normalize(
    document.getElementById("searchInput").value
  );

  const resultsBox = document.getElementById("results");

  resultsBox.innerHTML = "";

  if(!query){
    resultsBox.innerHTML =
      '<div class="no-result">कृपया नाम या मकान नंबर लिखें।</div>';
    return;
  }

  const matches = voters.filter(voter => {

    const name = normalize(voter.name);
    const relative = normalize(voter.relative);
    const house = normalize(voter.house);

    return (
      name.includes(query) ||
      relative.includes(query) ||
      house.includes(query)
    );

  });

  if(matches.length === 0){

    resultsBox.innerHTML =
      '<div class="no-result">कोई मतदाता नहीं मिला।</div>';

    return;
  }


  matches.forEach(voter => {

    const card = document.createElement("div");

    card.className = "result";

    card.innerHTML = `

      <h3>${voter.name || "—"}</h3>

      <div class="row">
        <span class="label">पिता/पति का नाम</span>
        <span>${voter.relative || "—"}</span>
      </div>

      <div class="row">
        <span class="label">मकान नं.</span>
        <span>${voter.house || "—"}</span>
      </div>

      <div class="row">
        <span class="label">उम्र</span>
        <span>${voter.age || "—"}</span>
      </div>

      <div class="row">
        <span class="label">लिंग</span>
        <span>${voter.gender || "—"}</span>
      </div>

      <div class="row">
        <span class="label">क्रम संख्या</span>
        <span>${voter.serial || "—"}</span>
      </div>

      <div class="row">
        <span class="label">भाग संख्या</span>
        <span>${voter.part || "—"}</span>
      </div>

      <div class="row">
        <span class="label">मतदान केंद्र</span>
        <span>${voter.booth || "—"}</span>
      </div>

    `;

    resultsBox.appendChild(card);

  });

}

</script>

</body>
</html>
